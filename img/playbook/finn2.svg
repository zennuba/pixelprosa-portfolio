<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Stregtegning af robotten Finn med smil, butterfly og en pakke på brystet</title>
<g fill="none" stroke="#060a3d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Skygge -->
  <ellipse cx="205" cy="404" rx="110" ry="10" fill="#d9dcff" stroke="none"/>

  <!-- Ben -->
  <rect x="150" y="316" width="40" height="84" rx="20" fill="#fff"/>
  <rect x="220" y="316" width="40" height="84" rx="20" fill="#fff"/>
  <path d="M150 340h40M220 340h40"/>

  <!-- Arme: venstre hånd i siden, højre ned langs kroppen -->
  <path d="M128 236c-30 14-40 46-30 70c6 14 22 18 34 12" fill="#fff"/>
  <circle cx="102" cy="290" r="5" fill="#d9dcff"/>
  <path d="M282 240c22 14 28 44 20 70" />
  <path d="M302 310c-6 8-16 8-20 0"/>

  <!-- Krop -->
  <rect x="122" y="214" width="166" height="122" rx="44" fill="#fff"/>
  <rect x="150" y="236" width="112" height="82" rx="20" fill="#fff"/>

  <!-- Pakke på brystet -->
  <path d="M182 262l24-10l24 10v30l-24 10l-24-10Z" fill="#d9dcff"/>
  <path d="M182 262l24 10l24-10M206 272v30M196 258l24 10v10"/>

  <!-- Knap -->
  <circle cx="166" cy="250" r="6" fill="#1f2fd6" stroke="none"/>

  <!-- Hals og butterfly -->
  <rect x="188" y="198" width="34" height="18" rx="6" fill="#fff"/>
  <path d="M205 220l-24-12v24Z" fill="#1f2fd6"/>
  <path d="M205 220l24-12v24Z" fill="#1f2fd6"/>
  <circle cx="205" cy="220" r="6" fill="#4c5cff"/>

  <!-- Ører -->
  <rect x="94" y="96" width="30" height="64" rx="15" fill="#fff"/>
  <circle cx="109" cy="128" r="9" fill="#1f2fd6" stroke="none"/>
  <rect x="290" y="104" width="22" height="48" rx="11" fill="#fff"/>

  <!-- Hoved -->
  <rect x="114" y="36" width="182" height="164" rx="66" fill="#fff"/>
  <path d="M150 52c18-8 38-10 56-8" stroke="#d9dcff" stroke-width="6"/>

  <!-- Skærm -->
  <rect x="136" y="64" width="140" height="112" rx="32" fill="#060a3d"/>
</g>

<!-- Ansigt på skærmen (lyse streger) -->
<g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
  <path d="M160 92c6-4 13-4 18 0M234 92c6-4 13-4 18 0"/>
  <path d="M196 136c6 8 16 8 22 0"/>
</g>
<g fill="#fff">
  <rect x="158" y="102" width="24" height="40" rx="12"/>
  <rect x="230" y="102" width="24" height="40" rx="12"/>
</g>
<!-- Pupiller (class="pupil", så øjnene kan følge musen) -->
<rect class="pupil" x="165" y="111" width="10" height="22" rx="5" fill="#060a3d"/>
<rect class="pupil" x="237" y="111" width="10" height="22" rx="5" fill="#060a3d"/>
<text x="206" y="84" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" letter-spacing="1.5" fill="#4c5cff">FINN</text>
</svg>