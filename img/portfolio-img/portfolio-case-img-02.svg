<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Stregtegning af et browservindue med PixelProsa-portfoliet, tre case-kort og en markør der klikker</title>
<g transform="translate(0 30)" fill="none" stroke="#060a3d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">

  <!-- Kode-vindue bagved, let forskudt -->
  <rect x="200" y="60" width="170" height="130" rx="14" fill="#d9dcff"/>
  <path d="M220 92l-10 10l10 10M246 92l10 10l-10 10M240 88l-12 28" stroke="#1f2fd6"/>
  <path d="M272 96h70M272 112h50M220 140h120M220 156h86" stroke-width="3"/>

  <!-- Browservindue -->
  <rect x="30" y="110" width="300" height="230" rx="18" fill="#fff"/>
  <path d="M30 146h300"/>
  <circle cx="54" cy="128" r="5" fill="#1f2fd6" stroke="none"/>
  <circle cx="72" cy="128" r="5" fill="#4c5cff" stroke="none"/>
  <circle cx="90" cy="128" r="5" fill="#d9dcff" stroke="none"/>
  <rect x="110" y="120" width="150" height="16" rx="8" stroke-width="2.5"/>

  <!-- Hero på siden: mini-logo + overskrift + knap -->
  <circle cx="64" cy="176" r="12" fill="#d9dcff"/>
  <path d="M86 172h60" stroke-width="4"/>
  <path d="M86 182h34" stroke="#1f2fd6" stroke-width="4"/>
  <path d="M54 206h150" stroke-width="6"/>
  <path d="M54 222h96" stroke-width="3"/>
  <rect x="54" y="234" width="56" height="16" rx="5" fill="#1f2fd6" stroke="none"/>

  <!-- Procesline med prikker = din visuelle signatur -->
  <path d="M230 186c20 6 30 26 52 26s28-18 30-30" stroke="#4c5cff" stroke-dasharray="1 8" stroke-width="4"/>

  <!-- Tre case-kort, der flugter -->
  <rect x="54" y="266" width="76" height="56" rx="8" fill="#d9dcff"/>
  <rect x="142" y="266" width="76" height="56" rx="8" fill="#d9dcff"/>
  <rect x="230" y="266" width="76" height="56" rx="8" fill="#d9dcff"/>
  <path d="M64 306h40M152 306h40M240 306h40" stroke-width="3"/>

  <!-- Musemarkør, der klikker på det midterste kort -->
  <path d="M196 284l0 46l12-12l9 20l9-4l-9-20l17 0Z" fill="#fff" stroke-width="3.5"/>
  <path d="M184 274l-8-8M196 268v-10M208 274l8-8" stroke="#1f2fd6"/>
</g>
</svg>