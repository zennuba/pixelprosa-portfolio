<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Stregtegning af en telefon der vibrerer med en mistænkelig SMS og en fiskekrog i linket</title>
<g fill="none" stroke="#060a3d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Vibrations-streger -->
  <g stroke="#1f2fd6">
    <path d="M72 170c-12 20-12 44 0 64M52 156c-18 28-18 64 0 92"/>
    <path d="M330 150c12 20 12 44 0 64M350 136c18 28 18 64 0 92"/>
  </g>

  <g transform="rotate(-6 200 220)">
    <!-- Telefon -->
    <rect x="104" y="30" width="190" height="370" rx="34" fill="#fff" stroke-width="5"/>
    <rect x="170" y="46" width="58" height="16" rx="8" fill="#060a3d" stroke="none"/>

    <!-- Afsender -->
    <circle cx="199" cy="104" r="20" fill="#d9dcff"/>
    <path d="M206 96c-4-4-14-4-14 2c0 8 14 4 14 12c0 6-10 6-14 2" stroke-width="3"/>
    <path d="M160 140h78" stroke-width="5"/>
    <path d="M184 154h30" stroke="#d9dcff" stroke-width="4"/>

    <!-- SMS-boble -->
    <path d="M122 176h138c8 0 14 6 14 14v120c0 8-6 14-14 14H136c-8 0-14-6-14-14Z" fill="#d9dcff" stroke="none"/>
    <g stroke-width="4">
      <path d="M138 198h96M138 214h70"/>
      <path d="M138 238h110M138 254h50"/>
      <path d="M138 302h60"/>
    </g>
    <!-- Linket: blåt og understreget -->
    <path d="M138 276h104" stroke="#1f2fd6" stroke-width="4"/>
    <path d="M138 284h104" stroke="#1f2fd6" stroke-width="2"/>
  </g>

  <!-- Fiskekrog, der hænger ned i linket = phishing -->
  <path d="M234 -4v250" stroke="#060a3d" stroke-width="2.5"/>
  <path d="M234 246v24c0 16 22 16 22 0v-8" stroke-width="4"/>
  <path d="M256 262l-5 7M256 262l5 7" stroke-width="4"/>
</g>
</svg>